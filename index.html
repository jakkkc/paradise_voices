<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Paradise Voices</title>

  <meta name="theme-color" content="#432A17" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app">
    <header class="app-header">
      <img src="assets/logo.png" alt="Hunters Paradise logo" />
      <span class="brand-name">Paradise Voices</span>
    </header>

    <main class="app-main">

      <!-- Step 1: PIN entry -->
      <div id="view-pin" class="view card active">
        <h2>Staff PIN</h2>
        <p class="subtitle">Enter your 4-digit PIN</p>

        <div class="pin-dots" id="pin-dots">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <div class="pin-keypad" id="pin-keypad">
          <button class="pin-key" data-key="1">1</button>
          <button class="pin-key" data-key="2">2</button>
          <button class="pin-key" data-key="3">3</button>
          <button class="pin-key" data-key="4">4</button>
          <button class="pin-key" data-key="5">5</button>
          <button class="pin-key" data-key="6">6</button>
          <button class="pin-key" data-key="7">7</button>
          <button class="pin-key" data-key="8">8</button>
          <button class="pin-key" data-key="9">9</button>
          <button class="pin-key pin-key-empty" tabindex="-1"></button>
          <button class="pin-key" data-key="0">0</button>
          <button class="pin-key pin-key-action" id="pin-backspace">&#9003;</button>
        </div>

        <div id="pin-error" class="status-line error" style="display:none;"></div>
      </div>

      <!-- Step 1: Room selection (receptionist only) -->
      <div id="view-room" class="view card">
        <h2 id="room-branch-name">Branch</h2>
        <p class="subtitle">Select the guest's room number</p>

        <label for="room-select">Room</label>
        <select id="room-select">
          <option value="" disabled selected>Choose a room…</option>
        </select>

        <button class="btn btn-primary" id="room-continue-btn" disabled>Hand Tablet to Guest</button>
        <button class="btn-link" id="room-back-btn">Not you? Re-enter PIN</button>
      </div>

      <!-- Temporary checkpoint screen — Step 4 replaces this with the real guest wizard -->
      <div id="view-ready" class="view card">
        <h2>Ready ✓</h2>
        <p class="subtitle">Step 4 will build the actual guest feedback form here.</p>
        <div class="room-summary">
          <strong>Branch:</strong> <span id="ready-branch"></span><br>
          <strong>Room:</strong> <span id="ready-room"></span>
        </div>
        <button class="btn-link" id="ready-back-btn">Start Over</button>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
